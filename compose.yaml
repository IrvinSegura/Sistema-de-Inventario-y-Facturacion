name: inventory-billing-system

services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=inventory'
      - 'POSTGRES_USER=inventory'
      - 'POSTGRES_PASSWORD=inventory'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'

volumes:
  postgres-data:
